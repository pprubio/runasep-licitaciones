name: Barrido mensual de contratos menores

on:
  schedule:
    # Día 1 de cada mes a las 04:00 UTC. Barre 35 días para cubrir el mes entero.
    - cron: "0 4 1 * *"
  workflow_dispatch:
    inputs:
      dias:
        description: "Días hacia atrás"
        required: false
        default: "35"

permissions:
  contents: write

jobs:
  barrido:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Ejecutar barrido mensual de contratos menores
        run: python barrido.py --solo menores --dias ${{ github.event.inputs.dias || 35 }}

      - name: Publicar resultado
        run: |
          git config user.name  "barrido-licitaciones"
          git config user.email "actions@github.com"
          mkdir -p salida/mensual
          cp salida/ultimo.json "salida/mensual/menores-$(date -u +%Y-%m).json"
          cp salida/ultimo.md   "salida/mensual/menores-$(date -u +%Y-%m).md"
          git add salida
          if git diff --cached --quiet; then
            echo "Sin cambios en salida/"
          else
            git commit -m "Barrido mensual de contratos menores $(date -u +%Y-%m)"
            git push
          fi

      - name: Resumen en la pestaña del run
        if: always()
        run: |
          if [ -f salida/ultimo.md ]; then
            head -c 60000 salida/ultimo.md >> "$GITHUB_STEP_SUMMARY"
          fi
